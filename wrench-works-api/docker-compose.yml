version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wrenchworks-db
    environment:
      POSTGRES_USER: wrenchworks
      POSTGRES_PASSWORD: wrenchworks_dev
      POSTGRES_DB: wrenchworks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrenchworks"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wrenchworks-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=wrenchworks;Username=wrenchworks;Password=wrenchworks_dev"
      Jwt__Key: "super-secret-dev-key-change-me-in-production-minimum-32-chars!"
      Jwt__Issuer: "wrenchworks"
      Jwt__Audience: "wrenchworks-client"
      Cors__Origins__0: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
